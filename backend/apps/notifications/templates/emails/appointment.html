<!doctype html>
<html>
  <body style="margin:0;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#0f172a">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding:24px 0">
      <tr>
        <td align="center">
          <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden">
            <tr>
              <td style="background:#0d9488;color:#ffffff;padding:20px 24px;font-size:20px;font-weight:bold">MediConnect</td>
            </tr>
            <tr>
              <td style="padding:24px">
                <p style="margin:0 0 8px">Hi {{ greeting_name }},</p>
                <h2 style="margin:0 0 8px;font-size:20px">{{ headline }}</h2>
                <p style="margin:0 0 20px;color:#475569">{{ message }}</p>
                <table cellpadding="6" cellspacing="0" style="background:#f8fafc;border-radius:8px;width:100%;font-size:14px">
                  <tr><td style="color:#64748b;width:90px">Doctor</td><td>{{ doctor }}{% if specialization %} ({{ specialization }}){% endif %}</td></tr>
                  <tr><td style="color:#64748b">Hospital</td><td>{{ hospital }}</td></tr>
                  <tr><td style="color:#64748b">When</td><td><strong>{{ when }}</strong></td></tr>
                  <tr><td style="color:#64748b">Status</td><td>{{ status }}</td></tr>
                  {% if reason %}<tr><td style="color:#64748b">Reason</td><td>{{ reason }}</td></tr>{% endif %}
                </table>
                <p style="margin:24px 0 0">
                  <a href="{{ link }}" style="background:#0d9488;color:#ffffff;padding:10px 18px;border-radius:6px;text-decoration:none">View appointments</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
